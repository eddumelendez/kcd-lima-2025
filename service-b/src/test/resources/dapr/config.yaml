apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: otel-config
spec:
  tracing:
    samplingRate: '1'
    stdout: true
    otel:
      endpointAddress: lgtm-stack:4318
      isSecure: false
      protocol: http
  httpPipeline:
    handlers:
      - name: routeralias
        type: middleware.http.routeralias
